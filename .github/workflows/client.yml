name: build-client

on:
  push:
    branches: [ main, master ]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (x64)
        working-directory: client
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        working-directory: client
        run: cmake --build build --config Release --parallel

      - name: Inspect output
        working-directory: client
        run: |
          dir build\Release
          python -c "import struct,os; p=r'build/Release/xiaoyu_client.dll'; d=open(p,'rb').read(0x200); pe=struct.unpack_from('<I', d, 0x3C)[0]; m=struct.unpack_from('<H', d, pe+4)[0]; print('machine=0x%04X (0x8664 = x64) size=%d' % (m, os.path.getsize(p)))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-client-x64
          path: client/build/Release/xiaoyu_client.dll
          if-no-files-found: error
