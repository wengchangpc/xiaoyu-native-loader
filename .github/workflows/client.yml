name: build-client

on:
  push:
    branches: [ main, master ]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  workflow_dispatch:

# 发布 release 需要写权限。默认 GITHUB_TOKEN 是只读的，不加这段上传会 403。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (x64)
        working-directory: client
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        working-directory: client
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build_log.txt
          # 显式把 cmake 的退出码透出去：管道接上 Tee-Object 之后，
          # PowerShell 的失败判定不一定还能拿到原生命令的 $LASTEXITCODE，
          # 不加这一行会出现"编译失败但步骤显示成功"。
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 编译失败时把日志当 release 附件传上去。
      # 为什么要这么做：这个仓库没有能匿名读 Actions API 的通道，
      # 构建一失败就只剩"产物没变"这一个现象，看不到到底哪一行报错。
      # 日志走 release 就能匿名下载：
      #   releases/download/ci-log/build_log.txt
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: "CI build log (last failure)"
          body: |
            最近一次构建失败的日志。
            commit: ${{ github.sha }}
            run: ${{ github.run_number }}
          files: client/build_log.txt
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect output
        working-directory: client
        run: |
          dir build\Release
          python -c "import struct,os; p=r'build/Release/xiaoyu_client.dll'; d=open(p,'rb').read(0x200); pe=struct.unpack_from('<I', d, 0x3C)[0]; m=struct.unpack_from('<H', d, pe+4)[0]; print('machine=0x%04X (0x8664 = x64) size=%d' % (m, os.path.getsize(p)))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-client-x64
          path: client/build/Release/xiaoyu_client.dll
          if-no-files-found: error

      # artifact 下载现在强制登录，public 仓库也一样。
      # 走 release 才能匿名拿：
      #   releases/download/ci-latest/xiaoyu_client.dll
      # tag 固定为 ci-latest，每次 push 覆盖同一个 release，永远指向最新构建。
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: "CI latest build"
          body: |
            自动构建产物，每次 push 覆盖。

            匿名下载：
            https://github.com/wengchangpc/xiaoyu-native-loader/releases/download/ci-latest/xiaoyu_client.dll

            commit: ${{ github.sha }}
            run: ${{ github.run_number }}
          files: client/build/Release/xiaoyu_client.dll
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
