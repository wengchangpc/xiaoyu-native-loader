name: build-dll

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 的控制台默认不是 UTF-8，脚本里有任何非 ASCII 的 print 都会炸
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed bootstrap payload
        run: python tools/embed.py

      - name: Configure (x64)
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Inspect output
        run: |
          dir build\Release
          python -c "import struct,os; p=r'build/Release/xiaoyu_loader.dll'; d=open(p,'rb').read(0x200); pe=struct.unpack_from('<I', d, 0x3C)[0]; m=struct.unpack_from('<H', d, pe+4)[0]; print('dll machine=0x%04X (0x8664 = x64) size=%d' % (m, os.path.getsize(p)))"
          python -c "import struct,os; p=r'build/Release/xiaoyu_inject.exe'; d=open(p,'rb').read(0x200); pe=struct.unpack_from('<I', d, 0x3C)[0]; m=struct.unpack_from('<H', d, pe+4)[0]; print('inject machine=0x%04X size=%d' % (m, os.path.getsize(p)))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-loader-x64
          path: |
            build/Release/xiaoyu_loader.dll
            build/Release/xiaoyu_inject.exe
          if-no-files-found: error
